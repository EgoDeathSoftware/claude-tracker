services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
      - "3001:3001"
    volumes:
      - ./client/src:/app/client/src
      - ./client/index.html:/app/client/index.html
      - ./server/src:/app/server/src
      - ./server/test:/app/server/test
      - ./server/config:/app/server/config
      - ${CLAUDE_DIR_1}:/claude/dir1:ro
      - ${CLAUDE_DIR_2}:/claude/dir2:ro
      - ${OPENCODE_DATA_DIR}:/opencode/data:ro
      - ${OPENCODE_CONFIG_DIR}:/opencode/config:ro
      - ${AGENT_CLAUDE_ROOT}:/claude/agents:ro
      - tracker-data:/app/data
    environment:
      - DATA_DIR=/app/data
      - PORT=3001
      - STORE_ACTIVE_DAYS=${STORE_ACTIVE_DAYS:-}
      - STORE_POLL_MS=${STORE_POLL_MS:-}
    restart: unless-stopped

volumes:
  tracker-data:
