# opencode-delegate configuration.
# install.sh copies this to <repo>/.delegate.conf — edit that copy, not this one.
# It's per-repo on purpose: TEST_CMD and the rest differ project to project.
# Commit .delegate.conf if the whole team should share these settings, gitignore
# it if not.

OPENCODE_MODEL="llama-swap/qwen3-coder-next"
OPENCODE_AGENT="implementer"

BASE_BRANCH="master"
MAX_RETRIES=2

# Required — the authoritative correctness gate. The script refuses to run
# without this set.
TEST_CMD="pnpm --filter @claude-tracker/server test"

# Optional fast-fail gates, run before TEST_CMD in this order. Leave empty to
# skip either one. These should be fast (seconds) — the point is killing an
# obviously broken diff before spending time on the full test suite.
LINT_CMD="pnpm lint"
TYPECHECK_CMD="pnpm typecheck"

# Informational only — surfaced in the JSON summary as recommend_full_diff_review
# so the calling subagent knows when a diff is large enough to actually read
# rather than trust the summary.
DIFF_SIZE_ESCALATE_LINES=400

LOG_FILE=".claude/logs/opencode-delegate.jsonl"

# Hard backstop per opencode invocation (wrapped in `timeout --signal=KILL`,
# in its own process group via setsid) — independent of whatever timeout the
# caller enforces on the whole script. Exists because a headless run can in
# principle hang waiting on a permission prompt that will never come; this
# guarantees the process dies instead of sitting on the GPU indefinitely.
#
# 900s (not the original 300s default) because qwen3.8-27b on this host's
# vLLM endpoint decodes at ~4.5 tokens/sec (measured directly against the
# server, independent of context size or reasoning). Even with
# chat_template_kwargs.enable_thinking=false set on the model (see
# .opencode/opencode.json), a real edit (~1500-2000 output tokens) plus the
# ~12k-token fixed prompt overhead from opencode's own tool schema needs
# room. Raise further if MAX_RETRIES keeps exhausting on real tasks.
OPENCODE_TIMEOUT_SECONDS=900

# Gate commands run via `eval` in a subshell of delegate-to-opencode.sh, so
# this script's own PATH — not the interactive shell's — is what matters.
# pnpm lives behind a corepack shim in a user-writable dir on this host (the
# fnm-managed node install under /opt/fnm is root-owned, so `corepack enable`
# targeted ~/.local/bin instead of the default location).
EXTRA_PATH="$HOME/.local/bin"
